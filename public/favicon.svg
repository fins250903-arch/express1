<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 128 128">
    <defs>
        <!-- Gold Gradient for the Sound Wave Bars -->
        <linearGradient id="gold-grad" x1="0" y1="0" x2="0" y2="128" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#fff099" />
            <stop offset="50%" stop-color="#d4af37" />
            <stop offset="100%" stop-color="#aa7c11" />
        </linearGradient>
        <!-- Dark Deep Blue Background Gradient -->
        <linearGradient id="bg-grad" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#1a1a2e" />
            <stop offset="100%" stop-color="#0d0d18" />
        </linearGradient>
        <!-- Subtle gold ring border gradient -->
        <linearGradient id="border-grad" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#d4af37" stop-opacity="0.8" />
            <stop offset="100%" stop-color="#1a1a2e" stop-opacity="0.2" />
        </linearGradient>
    </defs>
    <!-- Background Circle -->
    <circle cx="64" cy="64" r="60" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="3" />
    
    <!-- Sound Wave Bars (Equalizer) in Gold, perfectly centered -->
    <!-- Bar 1: X=24, Height=24 -->
    <rect x="24" y="52" width="8" height="24" rx="4" fill="url(#gold-grad)" />
    <!-- Bar 2: X=36, Height=48 -->
    <rect x="36" y="40" width="8" height="48" rx="4" fill="url(#gold-grad)" />
    <!-- Bar 3: X=48, Height=72 -->
    <rect x="48" y="28" width="8" height="72" rx="4" fill="url(#gold-grad)" />
    <!-- Bar 4: X=60, Height=96 -->
    <rect x="60" y="16" width="8" height="96" rx="4" fill="url(#gold-grad)" />
    <!-- Bar 5: X=72, Height=60 -->
    <rect x="72" y="34" width="8" height="60" rx="4" fill="url(#gold-grad)" />
    <!-- Bar 6: X=84, Height=80 -->
    <rect x="84" y="24" width="8" height="80" rx="4" fill="url(#gold-grad)" />
    <!-- Bar 7: X=96, Height=40 -->
    <rect x="96" y="44" width="8" height="40" rx="4" fill="url(#gold-grad)" />
</svg>
